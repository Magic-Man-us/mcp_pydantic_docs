[package]
name = "mcp-pydantic-docs"
version = "0.1.0"
edition = "2024"
description = "MCP server providing local-first access to Pydantic documentation with BM25-powered full-text search"

[[bin]]
name = "mcp-pydantic-docs"
path = "src/main.rs"

[[bin]]
name = "mcp-indexer"
path = "src/indexer_cli.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTML parsing
scraper = "0.22"

# Text processing
regex = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
